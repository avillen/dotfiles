# worktree-agent — arranca claude en el panel enfocado
#
# Es lo unico que se echaba de menos del script `hd` que vivia aqui: no tener
# que escribir `claude` a mano en cada worktree nuevo. Todo lo demas (crear,
# borrar, mergear) lo hace el plugin worktrunk.
#
# Solo tiene la accion manual (prefix+alt+c). Antes arrancaba claude solo con
# los eventos worktree.created/opened, pero el plugin worktrunk abre los
# worktrees como tab (open_mode = "tab", ver herdr/worktrunk.toml) y por esa via
# herdr no emite esos eventos. Si se vuelve al modo workspace, habria que
# recuperar los [[events]] y su rama en start.sh desde el historial de git.
#
# Se instala con `herdr plugin link` y no con `plugin install` (ver install.sh):
# el plugin vive en este repo. herdr CACHEA el manifest al enlazar, asi que
# tocar este fichero exige relink; los cambios en start.sh se cogen en la
# siguiente ejecucion, sin nada.
id = "worktree-agent"
name = "Worktree agent"
version = "0.2.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Arranca claude en el panel enfocado"

# Bindeada en config.toml. Sirve tambien fuera de un worktree: un space de
# investigacion con un tab por repo quiere su claude en cada uno.
[[actions]]
id = "start"
title = "Worktree: arrancar claude"
contexts = ["workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/start.sh\""]
