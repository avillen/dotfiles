# worktree-layout — el layout de trabajo de un worktree
#
# Es lo unico que aportaba el script `hd` que vivia aqui: al nacer el workspace
# de un worktree, dejar claude arriba y una terminal abajo. Todo lo demas
# (crear, borrar, mergear) lo hace el plugin worktrunk, que crea el checkout con
# `wt` —con sus hooks— y lo registra con `herdr worktree open`, que es
# precisamente lo que emite los eventos de aqui abajo.
#
# Se instala con `herdr plugin link` y no con `plugin install` (ver install.sh):
# el plugin vive en este repo. herdr CACHEA el manifest al enlazar, asi que
# tocar este fichero exige relink; los cambios en layout.sh se cogen en la
# siguiente ejecucion, sin nada.
id = "worktree-layout"
name = "Worktree layout"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Claude arriba y una terminal abajo al abrir un worktree"

# Hacen falta los dos eventos:
#   worktree.created  worktree creado por herdr (`herdr worktree create`)
#   worktree.opened   checkout que ya existe en disco y se registra con
#                     `herdr worktree open`. Esta es la via del plugin
#                     worktrunk, o sea la que se usa en la practica.
#
# El payload llega en $HERDR_PLUGIN_EVENT_JSON.
[[events]]
on = "worktree.created"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/layout.sh\""]

[[events]]
on = "worktree.opened"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/layout.sh\""]

# Para aplicarlo a mano en un workspace que ya existe: si cierras el claude de
# un worktree y quieres el layout otra vez. Bindeada en config.toml.
[[actions]]
id = "apply"
title = "Worktree: layout claude + terminal"
contexts = ["workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/layout.sh\""]
